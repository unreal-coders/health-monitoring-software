id: mood
name: Mood
domain: Behavioral
entry_kind: self-report
unit: points (0 to 6)
input: questionnaire

mechanism:
  summary: >-
    Prolonged isolation and confinement can increase the risk of behavioral
    issues and psychiatric disorders, such as anxiety and depression, which may
    affect sleep, morale, and decision making.
  hazards: [isolation-and-confinement, distance-from-earth]
  detail:
    - text: >-
        Common behavioral health concerns in spaceflight include stress,
        depression, anxiety, relationship problems, and grief. They can be
        temporary or develop into a psychiatric disorder.
      source: ochmo-tb-016
    - text: >-
        Mood disturbance (for example, irritability) is one of the conditions
        NASA says should be addressed on every mission.
      source: nasa-std-3001-v1
    - text: >-
        Crews on the ISS can talk with family and medical professionals, but long
        communication delays on a trip to Mars will create new challenges.
      source: hrp-risk-behavioral
  sources: [hrp-risk-behavioral, ochmo-tb-016, nasa-std-3001-v1]

measurement:
  method: >-
    The astronaut answers the Patient Health Questionnaire-2 (PHQ-2), a
    two-question depression screener. Each answer scores 0 to 3, and the total
    is 0 to 6.
  sources: [phq2-validation, phq-form]
  interval: 14 days
  interval_note: The PHQ-2 asks about the last 2 weeks.

questionnaire:
  prompt: Over the last 2 weeks, how often have you been bothered by the following problems?
  items:
    - id: interest
      text: Little interest or pleasure in doing things
    - id: down
      text: Feeling down, depressed, or hopeless
  options:
    - {label: Not at all, score: 0}
    - {label: Several days, score: 1}
    - {label: More than half the days, score: 2}
    - {label: Nearly every day, score: 3}
  score: sum
  source: phq-form
  permission: >-
    The PHQ form states: "No permission required to reproduce, translate,
    display or distribute." Developed by Drs. Robert L. Spitzer, Janet B.W.
    Williams, Kurt Kroenke and colleagues, with an educational grant from
    Pfizer Inc.

baseline:
  value: null
  type: null
  note: No baseline value found in the sources consulted.

thresholds:
  evaluation: first-match
  rules:
    - color: yellow
      label: Positive screen
      when: "value >= 3"
      text: >-
        Your answers are a positive screen for depression. This is not a
        diagnosis. Share it with the flight surgeon for a fuller evaluation.
      contact_flight_surgeon: true
      source: [phq2-validation, uw-phq2]
    - color: green
      label: Negative screen
      when: "value <= 2"
      text: Your answers are a negative screen for depression.
      contact_flight_surgeon: false
      source: phq2-validation
  note: >-
    NASA-STD-3001 gives no scale or values for a mood self-report, so the app
    uses the PHQ-2. In its validation study, a score of 3 or more had 83%
    sensitivity and 92% specificity for major depression, and 3 was the optimal
    cutpoint for screening. A positive screen should be followed up with a
    fuller evaluation (PHQ-9, other instruments, or an interview). The PHQ-2
    has no critical (red) level.
  sources: [phq2-validation, uw-phq2, nasa-std-3001-v1]

countermeasures:
  - text: Keeping a regular journal is one of the self-care options NASA encourages.
    source: hrp-risk-behavioral
  - text: Growing fresh vegetables may have therapeutic benefits as a reminder of life on Earth.
    source: hrp-risk-behavioral
  - text: Spacecraft windows reduce monotony and the sense of confinement, and privacy is a priority for psychological well-being.
    source: hrp-risk-behavioral
  - text: Crew care packages, support events, and family conferences are part of NASA's psychological support.
    source: ochmo-tb-016
  - text: Photographing Earth and journaling are important outlets to manage stress.
    source: ochmo-tb-016

flight_surgeon:
  when_to_contact: With a PHQ-2 score of 3 or more (positive screen).
  if_no_real_time_contact: >-
    Each vehicle has at least two crewmembers trained as Crew Medical Officers,
    the medical experts for the mission. The astronaut reports to them.
  sources: [phq2-validation, nasa-std-3001-v1]

astronaut_text:
  no_contact: If you cannot reach the flight surgeon, tell your Crew Medical Officer.
  missing: You have not answered the mood questions in the last 2 weeks.

limitations:
  - The PHQ-2 screens for depression only; it does not cover anxiety, stress, or irritability.
  - A positive screen is not a diagnosis and does not replace NASA's behavioral health evaluations.
  - The PHQ-2 was validated in primary care and obstetrics-gynecology clinics on Earth, not in spaceflight.
  - The validation study gives no different cutpoint by age or sex.

sources:
  - id: hrp-risk-behavioral
    title: Risk of Behavioral Changes and Psychiatric Disorders
    publisher: NASA Human Research Program
    url: https://www.nasa.gov/reference/risk-of-behavioral-conditions-and-psychiatric-disorders/
  - id: ochmo-tb-016
    title: "OCHMO-TB-016 Behavioral Health and Performance, Rev B"
    publisher: NASA Office of the Chief Health and Medical Officer
    url: https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-016-behavioral-health.pdf
  - id: nasa-std-3001-v1
    title: "NASA-STD-3001 Volume 1, Revision C: Crew Health"
    publisher: NASA
    url: https://standards.nasa.gov/sites/default/files/standards/NASA/C//nasa-std-3001-vol-1-rev-c-signature.pdf
    locator: "[V1 4011]; Appendix E, Table E.2-2; [V1 3006], [V1 5003]"
  - id: phq2-validation
    title: "Kroenke K, Spitzer RL, Williams JB. The Patient Health Questionnaire-2: validity of a two-item depression screener. Med Care. 2003;41(11):1284-1292"
    publisher: Medical Care
    url: https://doi.org/10.1097/01.mlr.0000093487.78664.3c
  - id: uw-phq2
    title: Patient Health Questionnaire-2 (PHQ-2)
    publisher: National HIV Curriculum, University of Washington
    url: https://www.hiv.uw.edu/page/mental-health-screening/phq-2
  - id: phq-form
    title: PHQ-4 form (contains the two PHQ-2 items)
    publisher: Shirley Ryan AbilityLab
    url: https://www.sralab.org/sites/default/files/2018-03/PHQ4.pdf

author: Troy Leonardo Moreno Calderon
reviewer: null
