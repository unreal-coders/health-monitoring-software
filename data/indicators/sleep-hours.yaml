id: sleep-hours
name: Sleep hours
domain: Behavioral
entry_kind: self-report
unit: hours
input: number

mechanism:
  summary: >-
    Astronauts face work overload, irregular light-dark cycles (16 sunrises and
    sunsets a day on the ISS), and disrupted sleep patterns. These stressors can
    lead to short- and long-term health problems that can affect the mission.
  hazards: [isolation-and-confinement]
  detail:
    - text: >-
        Astronauts sleep an average of about six hours in space, less than the
        amount recommended to maintain alertness, performance, and health.
        Actigraphy shows an average nightly sleep of 6 to 6.5 hours on the Space
        Shuttle and the ISS.
      source: ochmo-tb-041
    - text: Late insomnia is the medical condition with the highest likelihood per mission in NASA's sample Integrated Medical Model output.
      source: nasa-std-3001-v1
  sources:
    [hrp-risk-sleep, hrp-hazard-isolation, ochmo-tb-041, nasa-std-3001-v1]

measurement:
  method: >-
    The astronaut reports how many hours they slept on waking, or reads them from
    a wrist actigraphy device. NASA collects sleep reports and wrist-sensor
    activity data in Standard Measures, and actigraphy in ARCHeR.
  sources: [hrp-standard-measures, hrp-archer, ochmo-tb-041]
  interval: 1 day
  interval_basis: source
  interval_source: nasa-std-3001-v1
  interval_note: NASA-STD-3001 schedules one sleep period a day, at a consistent time from one day to the next.

valid_range:
  value:
    min: 0
    max: 24
    basis: definition
    note: A day has 24 hours.

baseline:
  value: null
  type: null
  note: No individual baseline value found in the NASA sources consulted.

thresholds:
  evaluation: first-match
  rules:
    - color: yellow
      label: Below the recommended amount
      when: "value < 7"
      text: You slept less than 7 hours, below what an average adult needs. Use your scheduled rest and self-care time.
      contact_flight_surgeon: false
      source: [ochmo-tb-041, hrp-risk-sleep]
    - color: green
      label: Recommended amount
      when: "value >= 7"
      text: You slept 7 hours or more, the amount an average adult needs.
      contact_flight_surgeon: false
      source: ochmo-tb-041
  note: >-
    OCHMO-TB-041 cites the National Sleep Foundation and the American Academy of
    Sleep Medicine: an average adult needs 7 to 9 hours of sleep for optimal
    daytime functioning. No NASA value was found for a critical (red) level.
  sources: [ochmo-tb-041]

reference_values:
  - text: NASA-STD-3001 recommends scheduling an 8.5-hour sleep period, plus 2 hours before and 1.5 hours after sleep.
    source: nasa-std-3001-v1

countermeasures:
  - text: On the ISS, LED lights simulate Earth's light-dark cycle to help astronauts sleep better.
    source: hrp-risk-sleep
  - text: Astronauts get designated time for relaxation and self-care to help prevent burnout.
    source: hrp-risk-sleep
  - text: Countermeasures for sleep shifting, fatigue, and sleep issues include light, naps, and medication or non-medication options.
    source: nasa-std-3001-v1

flight_surgeon:
  when_to_contact: >-
    No NASA rule for this indicator was found. Following the project rule, the
    astronaut shares any value the app cannot evaluate with the flight surgeon.
  if_no_real_time_contact: >-
    Each vehicle has at least two crewmembers trained as Crew Medical Officers,
    the medical experts for the mission. The astronaut reports to them.
  sources: [nasa-std-3001-v1]

astronaut_text:
  no_contact: If you cannot reach the flight surgeon, tell your Crew Medical Officer.
  missing: You have not logged your sleep yet.

limitations:
  - The 7-hour reference is for average adults on Earth, cited by NASA; NASA gives no spaceflight-specific value.
  - No NASA value was found for a critical (red) level of sleep loss.
  - OCHMO-TB-041 gives one range for an average adult (7 to 9 hours), and neither it nor the HRP sleep page gives different values by age or sex.

sources:
