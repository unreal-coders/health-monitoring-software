    publisher: NASA Office of the Chief Health and Medical Officer
    url: https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-041-sleep-accommodations.pdf
  - id: hrp-standard-measures
    title: Standard Measures
    publisher: NASA Human Research Program
    url: https://www.nasa.gov/reference/standard-measures/
  - id: hrp-archer
    title: ARCHeR
    publisher: NASA Human Research Program
    url: https://www.nasa.gov/reference/archer/
  - id: nasa-std-3001-v1
