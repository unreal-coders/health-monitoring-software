  - id: ochmo-tb-033
    title: "OCHMO-TB-033 Spaceflight Experience and Medical Care, Rev D"
    publisher: NASA Office of the Chief Health and Medical Officer
    url: https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-033-spaceflight-experience-medical-care.pdf
  - id: glenn-mim
    title: Multifunctional Integrated Medical Devices
    publisher: NASA Glenn Research Center
    url: https://www.nasa.gov/glenn/glenn-expertise-space-exploration/human-health-performance/exploration-medical-technologies/multifunctional-integrated-medical-devices
  - id: nasa-std-3001-v1
