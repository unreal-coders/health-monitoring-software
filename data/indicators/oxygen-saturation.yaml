id: oxygen-saturation
name: Oxygen saturation
domain: Cardiovascular
entry_kind: measurement
unit: "%"

mechanism:
  summary: >-
    Hypoxia is a lack of oxygen reaching the body's tissues. Steps taken to avoid
    decompression sickness during spacewalks on future deep space missions also
    raise the risk of mild hypoxia.
  hazards: []
  hazards_note: The NASA sources consulted do not link hypoxia to one of the five hazards.
  detail:
    - text: >-
        Hypoxia symptoms can interfere with crew comfort, health, and the ability
        to do tasks, which is why cabin pressure and oxygen levels are controlled.
        The ISS cabin is usually kept at sea-level equivalent pressure and oxygen.
      source: ochmo-tb-003
  sources: [hrp-risks, nasa-std-3001-v1, ochmo-tb-003]

measurement:
  method: >-
    Oxygen saturation is one of the vital signs that in-mission medical
    capabilities assess and store. NASA has tested pulse oximetry with the Tempus
    Pro multi-functional medical device.
  sources: [ochmo-tb-033, glenn-mim]
  interval: 1 day
  interval_basis: design
  interval_note: Interval chosen by the team; no source gives one.

valid_range:
  value:
    min: 0
    max: 100
    basis: definition
    note: A percentage cannot be below 0 or above 100.

baseline:
  value: null
  type: null
  note: No baseline value found in the NASA sources consulted.

thresholds:
  evaluation: first-match
  rules:
    - color: red
      label: Seek immediate medical attention
      when: "value <= 88"
      text: Your oxygen saturation is 88% or lower. Contact the flight surgeon now.
      contact_flight_surgeon: true
      source: medlineplus-pulse-ox
    - color: yellow
      label: Contact a provider
      when: "value <= 92"
      text: Your oxygen saturation is 92% or lower. Contact the flight surgeon.
      contact_flight_surgeon: true
      source: medlineplus-pulse-ox
    - color: yellow
      label: Below the normal range
      when: "value < 95"
      text: Your oxygen saturation is below the normal range of 95% to 100%.
      contact_flight_surgeon: false
      source: medlineplus-pulse-ox
    - color: green
      label: Normal
      when: "value >= 95"
      text: Your oxygen saturation is in the normal range.
      contact_flight_surgeon: false
      source: medlineplus-pulse-ox
  note: >-
    The NASA sources consulted give oxygen values as arterial partial pressure
    (PaO2), which needs a blood test, not as the saturation a pulse oximeter
    shows. The ranges come from MedlinePlus (U.S. National Library of
    Medicine): normal is 95% to 100%, contact a provider at 92% or lower, and
    seek immediate medical attention at 88% or lower. MedlinePlus gives no
    action for 93% to 94%, so that rule only says the value is below normal.
  sources: [medlineplus-pulse-ox, ochmo-tb-003]

countermeasures: []
countermeasures_note: No countermeasure for the astronaut found in the NASA sources consulted.

flight_surgeon:
  when_to_contact: >-
    At 92% or lower; immediately at 88% or lower (MedlinePlus).
  if_no_real_time_contact: >-
    Each vehicle has at least two crewmembers trained as Crew Medical Officers,
    the medical experts for the mission. The astronaut reports to them.
  sources: [nasa-std-3001-v1]

astronaut_text:
  no_contact: If you cannot reach the flight surgeon, tell your Crew Medical Officer.
  missing: You have not logged your oxygen saturation yet.

limitations:
  - The ranges are Earth clinical references from MedlinePlus, not values made for spaceflight. NASA gives none for saturation.
  - Pulse oximetry results may be 2% to 4% higher or lower than the actual blood oxygen level (MedlinePlus).
  - Darker skin pigmentation and dark nail polish can make the reading inaccurate (MedlinePlus).
  - Lower levels may be acceptable for people with lung disease such as COPD or pneumonia (MedlinePlus).
  - MedlinePlus gives no different ranges by age or sex.

sources:
