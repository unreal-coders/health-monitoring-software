id: oxygen-saturation
name: Oxygen saturation
domain: Cardiovascular
entry_kind: measurement
unit: "%"

mechanism:
  summary: >-
    Hypoxia is a lack of oxygen reaching the body's tissues. Steps taken to avoid
    decompression sickness during spacewalks on future deep space missions also
    raise the risk of mild hypoxia.
  hazards: []
  hazards_note: The NASA sources consulted do not link hypoxia to one of the five hazards.
  detail:
    - text: >-
        Hypoxia symptoms can interfere with crew comfort, health, and the ability
        to do tasks, which is why cabin pressure and oxygen levels are controlled.
        The ISS cabin is usually kept at sea-level equivalent pressure and oxygen.
      source: ochmo-tb-003
  sources: [hrp-risks, nasa-std-3001-v1, ochmo-tb-003]

measurement:
  method: >-
    Oxygen saturation is one of the vital signs that in-mission medical
    capabilities assess and store. NASA has tested pulse oximetry with the Tempus
    Pro multi-functional medical device.
  sources: [ochmo-tb-033, glenn-mim]
  interval: null
  interval_note: No measurement interval found in the NASA sources consulted.

baseline:
  value: null
  type: null
  note: No baseline value found in the NASA sources consulted.

thresholds:
  green: null
  yellow: null
  red: null
  note: >-
    The NASA sources consulted give oxygen values as arterial partial pressure
    (PaO2), which needs a blood test, not as the oxygen saturation a pulse
    oximeter shows. No green, yellow, or red range is defined until the team
    agrees on a source.
  sources: [ochmo-tb-003]

countermeasures: []
countermeasures_note: No countermeasure for the astronaut found in the NASA sources consulted.

flight_surgeon:
  when_to_contact: >-
    No NASA rule for this indicator was found. Following the project rule, the
    astronaut shares any value the app cannot evaluate with the flight surgeon.
  if_no_real_time_contact: >-
    Each vehicle has at least two crewmembers trained as Crew Medical Officers,
    the medical experts for the mission. The astronaut reports to them.
  sources: [nasa-std-3001-v1]

astronaut_text:
  no_reference: There is no NASA reference to rate this value yet. Share it with the flight surgeon.
  no_contact: If you cannot reach the flight surgeon, tell your Crew Medical Officer.
  missing: You have not logged your oxygen saturation yet.

limitations:
  - The NASA sources consulted give no oxygen saturation ranges, so the app cannot assign a color yet.

sources:
