id: heart-rate
name: Heart rate
domain: Cardiovascular
entry_kind: measurement
unit: beats per minute

mechanism:
  summary: >-
    Weightlessness changes blood circulation and how the heart and blood vessels
    work. Spaceflight can lead to heart arrhythmias and other cardiovascular
    problems, and the risk grows with longer missions.
  hazards: [gravity-fields]
  detail:
    - text: >-
        On return to gravity, lower blood volume can cause orthostatic
        intolerance. Its symptoms include decreased blood pressure and increased
        heart rate.
      source: ochmo-tb-033
    - text: >-
        Compression garments help maintain blood pressure and reduce a fast heart
        rate (tachycardia) after landing.
      source: ochmo-tb-019
  sources: [hrp-risk-cardio, ochmo-tb-019, ochmo-tb-033]

measurement:
  method: >-
    Heart rate is one of the vital signs that in-mission medical capabilities
    assess and store. NASA has tested heart monitoring (electrocardiogram) and
    pulse oximetry with the Tempus Pro multi-functional medical device.
  sources: [ochmo-tb-033, glenn-mim]
  interval: 1 day
  interval_basis: design
  interval_note: Interval chosen by the team; no source gives one.

valid_range:
  value:
    min: 20
    max: 250
    basis: design
    note: Input limit chosen by the team to catch typing errors. It is not a medical value.

baseline:
  value: null
  type: null
  note: No baseline value found in the NASA sources consulted.

thresholds:
  evaluation: first-match
  applies_to: >-
    Resting heart rate, measured sitting or lying down, calm, and feeling well.
  rules:
    - color: yellow
      label: Above the normal resting range
      when: "value > 100"
      text: >-
        Your resting heart rate is above the normal range. This is not always a
        sign of a problem. Share it with the flight surgeon.
      contact_flight_surgeon: true
      source: aha-heart-rate
    - color: yellow
      label: Below the normal resting range
      when: "value < 60"
      text: >-
        Your resting heart rate is below the normal range. This does not always
        signal a problem and is common in athletes. Share it with the flight
        surgeon.
      contact_flight_surgeon: true
      source: aha-heart-rate
    - color: green
      label: Normal resting range
      when: "value >= 60 and value <= 100"
      text: Your resting heart rate is in the normal range.
      contact_flight_surgeon: false
      source: aha-heart-rate
  note: >-
    NASA-STD-3001 gives no numeric heart rate ranges, so the range comes from the
    American Heart Association: a normal resting heart rate is between 60 and
    100 beats per minute. The AHA gives no critical (red) value. Sharing an
    out-of-range value with the flight surgeon follows the project rule.
  sources: [aha-heart-rate, nasa-std-3001-v1]

countermeasures:
  - text: Regular exercise and a healthy diet help crews keep cardiovascular fitness.
    source: hrp-risk-cardio
  - text: In-flight aerobic or resistance exercise counteracts cardiac and muscle deconditioning.
    source: ochmo-tb-019
  - text: Before landing, compression garments help maintain blood pressure and reduce a fast heart rate.
    source: ochmo-tb-019

flight_surgeon:
  when_to_contact: >-
    When the resting heart rate is outside 60 to 100 beats per minute. The AHA
    says this is not always a problem; sharing it follows the project rule.
  if_no_real_time_contact: >-
    Each vehicle has at least two crewmembers trained as Crew Medical Officers,
    the medical experts for the mission. The astronaut reports to them.
  sources: [nasa-std-3001-v1]

astronaut_text:
  how_to: Measure while sitting or lying down, calm, and feeling well.
  no_contact: If you cannot reach the flight surgeon, tell your Crew Medical Officer.
  missing: You have not logged your heart rate yet.

limitations:
  - The range is an Earth clinical reference from the AHA, not a value made for spaceflight. NASA gives none.
  - The range only applies at rest. Heart rate rises with exercise and does not return to resting right away.
  - The AHA page gives no different ranges by age or sex.

