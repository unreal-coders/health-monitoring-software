id: blood-pressure
name: Blood pressure
domain: Cardiovascular
entry_kind: measurement
unit: mmHg

mechanism:
  summary: >-
    Weightlessness changes blood circulation and how the heart and blood vessels
    work. Spaceflight can lead to blood clots, heart arrhythmias, and low blood
    pressure, which raises the chance of fainting at landing.
  hazards: [gravity-fields]
  detail:
    - text: >-
        In microgravity, body fluids shift toward the head, and within about two
        days the body reduces circulating fluid volume by around 15%. On return
        to gravity, this lower volume can cause orthostatic intolerance: the body
        cannot keep blood pressure up when standing, which can lead to fainting.
      source: ochmo-tb-019
    - text: >-
        Symptoms of orthostatic intolerance after landing include decreased blood
        pressure and increased heart rate.
      source: ochmo-tb-033
  sources: [hrp-risk-cardio, ochmo-tb-019, ochmo-tb-033]

measurement:
  method: >-
    Blood pressure is one of the vital signs that in-mission medical capabilities
    assess and store. NASA has tested non-invasive blood pressure measurement with
    the Tempus Pro multi-functional medical device.
  sources: [ochmo-tb-033, glenn-mim]
  interval: null
  interval_note: No measurement interval found in the NASA sources consulted.

baseline:
  value: null
  type: null
  note: No baseline value found in the NASA sources consulted.

thresholds:
  green: null
  yellow: null
  red: null
  note: >-
    NASA-STD-3001 says in-mission medical care follows current U.S. medical care
    practices, within mission limits, but does not give numeric blood pressure
    ranges. No green, yellow, or red range is defined until the team agrees on
    a source.
  sources: [nasa-std-3001-v1]

countermeasures:
  - text: Regular exercise and a healthy diet help crews keep cardiovascular fitness.
    source: hrp-risk-cardio
  - text: >-
      Before landing, lower-body compression garments and drinking fluids help
      prevent low blood pressure.
    source: hrp-risk-cardio
  - text: >-
      Current protocols include drinking 24 to 48 oz of salt water (sodium
      chloride solution) before deorbit, depending on body weight.
    source: ochmo-tb-019
  - text: In-flight aerobic or resistance exercise counteracts cardiac and muscle deconditioning.
    source: ochmo-tb-019

flight_surgeon:
  when_to_contact: >-
    No NASA rule for this indicator was found. Following the project rule, the
    astronaut shares any value the app cannot evaluate with the flight surgeon.
  if_no_real_time_contact: >-
    Each vehicle has at least two crewmembers trained as Crew Medical Officers,
    the medical experts for the mission. The astronaut reports to them.
  sources: [nasa-std-3001-v1]

astronaut_text:
  no_reference: There is no NASA reference to rate this value yet. Share it with the flight surgeon.
  no_contact: If you cannot reach the flight surgeon, tell your Crew Medical Officer.
  missing: You have not logged your blood pressure yet.

limitations:
  - The NASA sources consulted give no numeric blood pressure ranges, so the app cannot assign a color yet.
  - Females generally show more orthostatic intolerance symptoms in tilt tests (ochmo-tb-019). This affects risk, not a threshold.

